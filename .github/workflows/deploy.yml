name: Deploy — WIINUP MAX v9

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  NODE_VERSION: "20"
  SITE_URL: https://wiinupmax.com
  FUNCTION_URL: https://${{ secrets.SUPABASE_PROJECT_ID }}.supabase.co/functions/v1

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # 1. QUALITY GATE
  # ─────────────────────────────────────────────────────────────────────────────
  quality-gate:
    name: "🏗️ Quality Gate"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: ESLint
        run: npm run lint

      - name: Unit tests (Vitest)
        run: npm run test

      - name: Production build
        run: npm run build

      - name: Bundle size budget (< 2MB JS)
        run: |
          JS_SIZE=$(find dist/assets -name "*.js" -exec wc -c {} + 2>/dev/null | tail -1 | awk '{print $1}' || echo "0")
          JS_KB=$((JS_SIZE / 1024))
          echo "→ JS bundle total: ${JS_KB}KB"
          [ "$JS_KB" -lt 2048 ] \
            && echo "✅ Bundle OK (${JS_KB}KB < 2048KB)" \
            || echo "⚠️  Bundle > 2MB — review code splitting (lucide-react, framer-motion)"
        continue-on-error: true

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  # ─────────────────────────────────────────────────────────────────────────────
  # 2. SECURITY AUDIT
  # ─────────────────────────────────────────────────────────────────────────────
  security-audit:
    name: "🔒 Security Audit"
    runs-on: ubuntu-latest
    needs: quality-gate
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci

      - name: npm audit (high + critical)
        run: npm audit --audit-level=high

      - name: No hardcoded secrets in source
        run: |
          echo "🔍 Scanning for hardcoded secrets..."
          if grep -rn \
            --include="*.ts" --include="*.tsx" --include="*.js" \
            --exclude-dir=node_modules --exclude-dir=.git \
            -E "(sk_live_|sk_test_|whsec_|service_role.*eyJ|SUPABASE_SERVICE_ROLE)" \
            src/ supabase/functions/ 2>/dev/null | \
            grep -v "Deno.env.get\|process.env\|import.meta.env\|// "; then
            echo "❌ Potential hardcoded secret found!"
            exit 1
          fi
          echo "✅ No hardcoded secrets."

      - name: No legacy AI endpoint calls in frontend
        run: |
          LEGACY=0
          for pattern in "ai-jarvis" "ai-lead-scoring" "ai-matching" "ai-prospection" \
                         "ada-voice-call" "ada-orchestrator" "openclaw" "elevenlabs" \
                         "etg-aggregate" "etg-ingest" "etg-predict" "deal-radar-score"; do
            if grep -rn --include="*.ts" --include="*.tsx" \
              --exclude-dir=node_modules "$pattern" src/ 2>/dev/null; then
              echo "❌ Legacy ref '$pattern' found in frontend!"
              LEGACY=$((LEGACY+1))
            fi
          done
          [ $LEGACY -eq 0 ] && echo "✅ No legacy AI endpoints in frontend." || exit 1

      - name: RLS / Auth guard coverage
        run: |
          echo "🔒 Verifying auth guards in Edge Functions..."
          UNGUARDED=0
          for f in supabase/functions/*/index.ts; do
            name=$(basename $(dirname "$f"))
            case "$name" in stripe-webhook|auth-email-hook|track-click) continue ;; esac
            if ! grep -qE "(requireAuth|supabase\.auth\.getUser|SERVICE_KEY|SUPABASE_SERVICE_ROLE_KEY|Authorization)" "$f" 2>/dev/null; then
              echo "⚠️  $f — no auth guard"
              UNGUARDED=$((UNGUARDED+1))
            fi
          done
          [ $UNGUARDED -eq 0 ] && echo "✅ All Edge Functions guarded." \
            || (echo "❌ $UNGUARDED unguarded function(s)!" && exit 1)

      - name: Rate-limit coverage
        run: |
          echo "⏱ Rate-limit audit..."
          for f in supabase/functions/*/index.ts; do
            name=$(basename $(dirname "$f"))
            case "$name" in
              stripe-webhook|auth-email-hook|track-click|\
              send-welcome-email|send-reactivation-email|\
              notify-gain-paye|notify-intro-validated|\
              notify-royalty-split|process-email-queue|\
              process-pending-payouts|bank-webhook) continue ;;
            esac
            grep -qE "(checkRateLimit|rateLimit|rate_limit)" "$f" 2>/dev/null \
              && echo "  ✅ $name" || echo "  ℹ️  $name — no rate-limit"
          done
          echo "✅ Rate-limit audit complete."

      - name: No wildcard CORS
        run: |
          if grep -rn --include="*.ts" --exclude-dir=node_modules \
            'Allow-Origin.*\*' supabase/functions/_shared/cors.ts 2>/dev/null | \
            grep -v "wiinupmax.com\|lovable.app\|localhost"; then
            echo "❌ Wildcard CORS detected!"; exit 1
          fi
          echo "✅ CORS hardened."

  # ─────────────────────────────────────────────────────────────────────────────
  # 3. DEPLOY EDGE FUNCTIONS
  # ─────────────────────────────────────────────────────────────────────────────
  deploy-functions:
    name: "🚀 Deploy Edge Functions"
    runs-on: ubuntu-latest
    needs: security-audit
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy all Edge Functions
        run: |
          supabase functions deploy --project-ref "$SUPABASE_PROJECT_ID"
          echo "✅ Edge Functions deployed."

      - name: Log deployed functions
        run: |
          echo "📋 Deployed functions:"
          ls supabase/functions/ | grep -v "_shared" | sed 's/^/  ✓ /'

  # ─────────────────────────────────────────────────────────────────────────────
  # 4. E2E SMOKE TESTS
  # ─────────────────────────────────────────────────────────────────────────────
  e2e-smoke:
    name: "🧪 E2E Smoke Tests"
    runs-on: ubuntu-latest
    needs: deploy-functions
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Live site health check
        run: |
          HTTP=$(curl -o /dev/null -s -w "%{http_code}" "${{ env.SITE_URL }}/")
          echo "→ ${{ env.SITE_URL }} → HTTP $HTTP"
          [ "$HTTP" -eq 200 ] || (echo "❌ Site down!" && exit 1)
          echo "✅ Live site OK."

      - name: Meta tags — no legacy AI mentions
        run: |
          HTML=$(curl -s "${{ env.SITE_URL }}/")
          echo "$HTML" | grep -q "WIINUP MAX" || (echo "❌ Title missing" && exit 1)
          if echo "$HTML" | grep -qiE "assistant.ia|vocal|24h.24|assistant intelligent"; then
            echo "❌ Legacy AI text in live HTML!"; exit 1
          fi
          echo "✅ Meta tags clean."

      - name: Stripe webhook — rejects unsigned requests
        run: |
          HTTP=$(curl -o /dev/null -s -w "%{http_code}" \
            -X POST "${{ env.FUNCTION_URL }}/stripe-webhook" \
            -H "Content-Type: application/json" -d '{}')
          echo "→ stripe-webhook (no sig) → HTTP $HTTP"
          [ "$HTTP" -eq 400 ] || [ "$HTTP" -eq 401 ] || [ "$HTTP" -eq 403 ] \
            || (echo "❌ stripe-webhook not fail-closed!" && exit 1)
          echo "✅ stripe-webhook fail-closed."

      - name: Legacy AI endpoints are dead
        run: |
          ALIVE=0
          for endpoint in "ai-jarvis" "ada-voice-call" "openclaw-status" \
                          "elevenlabs-tts" "etg-predict" "deal-radar-score"; do
            HTTP=$(curl -o /dev/null -s -w "%{http_code}" \
              -X POST "${{ env.FUNCTION_URL }}/$endpoint" \
              -H "Content-Type: application/json" -d '{}')
            echo "→ $endpoint → HTTP $HTTP"
            [ "$HTTP" -ne 404 ] && [ "$HTTP" -ne 401 ] && [ "$HTTP" -ne 403 ] \
              && ALIVE=$((ALIVE+1)) || true
          done
          [ $ALIVE -eq 0 ] && echo "✅ All legacy endpoints blocked." \
            || (echo "❌ $ALIVE legacy endpoint(s) still accessible!" && exit 1)

  # ─────────────────────────────────────────────────────────────────────────────
  # 5. LIGHTHOUSE CI (Performance Budget)
  # ─────────────────────────────────────────────────────────────────────────────
  lighthouse:
    name: "🔦 Lighthouse CI"
    runs-on: ubuntu-latest
    needs: e2e-smoke
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli@0.14.x

      - name: Run Lighthouse CI on live site
        run: |
          lhci autorun \
            --collect.url="${{ env.SITE_URL }}" \
            --collect.numberOfRuns=1 \
            --assert.preset=lighthouse:no-pwa \
            --assert.assertions.performance=["warn",{"minScore":0.75}] \
            --assert.assertions.accessibility=["error",{"minScore":0.9}] \
            --assert.assertions.best-practices=["warn",{"minScore":0.85}] \
            --assert.assertions.seo=["error",{"minScore":0.9}] \
            --upload.target=temporary-public-storage 2>&1 | tee lhci-output.txt || true
          echo "✅ Lighthouse scan complete."

      - name: Parse and report Lighthouse scores
        run: |
          echo "📊 Lighthouse Results — ${{ env.SITE_URL }}"
          echo "─────────────────────────────────────────"
          # Extract scores from LHCI output
          grep -E "(performance|accessibility|best-practices|seo).*score" lhci-output.txt 2>/dev/null \
            | head -20 || echo "  (Run manually: npx lhci autorun --collect.url=${{ env.SITE_URL }})"
          # Post report URL if available
          grep -oE "https://storage\.googleapis\.com[^ ]+" lhci-output.txt 2>/dev/null \
            | head -1 | xargs -I{} echo "  📎 Full report: {}" || true
        continue-on-error: true

  # ─────────────────────────────────────────────────────────────────────────────
  # 6. MONITORING — RESEND ALERT ON FAILURE
  # ─────────────────────────────────────────────────────────────────────────────
  notify-failure:
    name: "🚨 Alert on Failure"
    runs-on: ubuntu-latest
    needs: [quality-gate, security-audit, deploy-functions, e2e-smoke, lighthouse]
    if: failure()
    steps:
      # ── Log to Supabase business_alerts ───────────────────────────────────
      - name: Log deploy failure to business_alerts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            PAYLOAD=$(printf '{"alert_type":"deploy_failure","title":"❌ Deploy FAILED — %s","message":"Workflow: %s/actions/runs/%s","severity":"critical","resolved":false,"email_sent":false}' \
              "$(date -u '+%Y-%m-%d %H:%M UTC')" \
              "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
              "$GITHUB_RUN_ID")
            HTTP=$(curl -s -o /dev/null -w "%{http_code}" \
              -X POST "${SUPABASE_URL}/rest/v1/business_alerts" \
              -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
              -H "Content-Type: application/json" \
              -d "$PAYLOAD")
            echo "→ business_alerts insert → HTTP $HTTP"
            [ "$HTTP" -eq 201 ] && echo "✅ Alert logged." || echo "⚠️  Alert insert failed (HTTP $HTTP)"
          else
            echo "⚠️  SUPABASE_URL or SUPABASE_SERVICE_ROLE_KEY not set — alert skipped."
          fi

      # ── Send email via Resend ──────────────────────────────────────────────
      - name: Send failure alert email via Resend
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
        run: |
          if [ -n "$RESEND_API_KEY" ] && [ -n "$ALERT_EMAIL" ]; then
            RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            HTTP=$(curl -s -o /dev/null -w "%{http_code}" \
              -X POST "https://api.resend.com/emails" \
              -H "Authorization: Bearer ${RESEND_API_KEY}" \
              -H "Content-Type: application/json" \
              -d "{
                \"from\": \"alerts@wiinupmax.com\",
                \"to\": [\"${ALERT_EMAIL}\"],
                \"subject\": \"❌ WIINUP MAX — Deploy FAILED $(date -u '+%Y-%m-%d %H:%M UTC')\",
                \"html\": \"<h2>Deployment Failed</h2><p>The WIINUP MAX production deploy has failed.</p><p><strong>Workflow run:</strong> <a href='${RUN_URL}'>${RUN_URL}</a></p><p>Check the GitHub Actions logs immediately.</p>\"
              }")
            echo "→ Resend alert → HTTP $HTTP"
            [ "$HTTP" -eq 200 ] || [ "$HTTP" -eq 201 ] \
              && echo "✅ Alert email sent to ${ALERT_EMAIL}." \
              || echo "⚠️  Resend send failed (HTTP $HTTP) — check RESEND_API_KEY secret."
          else
            echo "⚠️  RESEND_API_KEY or ALERT_EMAIL not set — email alert skipped."
          fi

      - name: Fail the workflow (force red)
        run: |
          echo "❌ WIINUP MAX v9 deployment FAILED."
          echo "→ $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          exit 1
