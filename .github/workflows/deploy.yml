name: Deploy — WIINUP MAX v8

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  NODE_VERSION: "20"
  SITE_URL: https://wiinupmax.com
  FUNCTION_URL: https://${{ secrets.SUPABASE_PROJECT_ID }}.supabase.co/functions/v1

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # 1. QUALITY GATE
  # ─────────────────────────────────────────────────────────────────────────────
  quality-gate:
    name: "🏗️ Quality Gate"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: ESLint
        run: npm run lint

      - name: Unit tests (Vitest)
        run: npm run test

      - name: Production build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  # ─────────────────────────────────────────────────────────────────────────────
  # 2. SECURITY AUDIT
  # ─────────────────────────────────────────────────────────────────────────────
  security-audit:
    name: "🔒 Security Audit"
    runs-on: ubuntu-latest
    needs: quality-gate
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci

      # ── npm audit ──────────────────────────────────────────────────────────
      - name: npm audit (high + critical)
        run: npm audit --audit-level=high

      # ── No hardcoded secrets ───────────────────────────────────────────────
      - name: No hardcoded secrets in source
        run: |
          echo "🔍 Scanning for hardcoded secrets..."
          if grep -rn \
            --include="*.ts" --include="*.tsx" --include="*.js" \
            --exclude-dir=node_modules --exclude-dir=.git \
            -E "(sk_live_|sk_test_|whsec_|service_role.*eyJ|SUPABASE_SERVICE_ROLE)" \
            src/ supabase/functions/ 2>/dev/null | \
            grep -v "Deno.env.get\|process.env\|import.meta.env\|// "; then
            echo "❌ Potential hardcoded secret found!"
            exit 1
          fi
          echo "✅ No hardcoded secrets."

      # ── No legacy AI endpoints ─────────────────────────────────────────────
      - name: No legacy AI endpoint calls in frontend
        run: |
          LEGACY=0
          for pattern in "ai-jarvis" "ai-lead-scoring" "ai-matching" "ai-prospection" \
                         "ada-voice-call" "ada-orchestrator" "openclaw" "elevenlabs" \
                         "etg-aggregate" "etg-ingest" "etg-predict" "deal-radar-score"; do
            if grep -rn --include="*.ts" --include="*.tsx" \
              --exclude-dir=node_modules "$pattern" src/ 2>/dev/null; then
              echo "❌ Legacy ref '$pattern' found in frontend!"
              LEGACY=$((LEGACY+1))
            fi
          done
          [ $LEGACY -eq 0 ] && echo "✅ No legacy AI endpoints in frontend." || exit 1

      # ── Auth guard coverage ────────────────────────────────────────────────
      - name: RLS / Auth guard coverage
        run: |
          echo "🔒 Verifying auth guards in Edge Functions..."
          UNGUARDED=0
          for f in supabase/functions/*/index.ts; do
            name=$(basename $(dirname "$f"))
            case "$name" in stripe-webhook|auth-email-hook|track-click) continue ;; esac
            if ! grep -qE "(requireAuth|supabase\.auth\.getUser|SERVICE_KEY|SUPABASE_SERVICE_ROLE_KEY|Authorization)" "$f" 2>/dev/null; then
              echo "⚠️  $f — no auth guard"
              UNGUARDED=$((UNGUARDED+1))
            fi
          done
          [ $UNGUARDED -eq 0 ] && echo "✅ All Edge Functions guarded." \
            || (echo "❌ $UNGUARDED unguarded function(s)!" && exit 1)

      # ── Rate-limit coverage ────────────────────────────────────────────────
      - name: Rate-limit coverage (non-webhook functions)
        run: |
          echo "⏱ Verifying rate-limit presence..."
          MISSING=0
          for f in supabase/functions/*/index.ts; do
            name=$(basename $(dirname "$f"))
            # Webhooks + auth hooks don't need rate limiting
            case "$name" in
              stripe-webhook|auth-email-hook|track-click|\
              send-welcome-email|send-reactivation-email|\
              notify-gain-paye|notify-intro-validated|\
              notify-royalty-split|process-email-queue|\
              process-pending-payouts|bank-webhook) continue ;;
            esac
            if ! grep -qE "(checkRateLimit|rateLimit|rate_limit)" "$f" 2>/dev/null; then
              echo "ℹ️  $f — rate-limit not detected (review if needed)"
            fi
          done
          echo "✅ Rate-limit audit complete."

      # ── CORS check ─────────────────────────────────────────────────────────
      - name: No wildcard CORS
        run: |
          if grep -rn --include="*.ts" --exclude-dir=node_modules \
            'Allow-Origin.*\*' supabase/functions/_shared/cors.ts 2>/dev/null | \
            grep -v "wiinupmax.com\|lovable.app\|localhost"; then
            echo "❌ Wildcard CORS detected!"
            exit 1
          fi
          echo "✅ CORS hardened."

  # ─────────────────────────────────────────────────────────────────────────────
  # 3. DEPLOY EDGE FUNCTIONS
  # ─────────────────────────────────────────────────────────────────────────────
  deploy-functions:
    name: "🚀 Deploy Edge Functions"
    runs-on: ubuntu-latest
    needs: security-audit
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy all Edge Functions
        run: |
          supabase functions deploy --project-ref "$SUPABASE_PROJECT_ID"
          echo "✅ Edge Functions deployed."

      - name: Log deployed functions
        run: |
          echo "📋 Deployed functions:"
          ls supabase/functions/ | grep -v "_shared" | sed 's/^/  ✓ /'

  # ─────────────────────────────────────────────────────────────────────────────
  # 4. E2E SMOKE TESTS + MONITORING CHECK
  # ─────────────────────────────────────────────────────────────────────────────
  e2e-smoke:
    name: "🧪 E2E Smoke Tests"
    runs-on: ubuntu-latest
    needs: deploy-functions
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # ── Live site ──────────────────────────────────────────────────────────
      - name: Live site health check
        run: |
          HTTP=$(curl -o /dev/null -s -w "%{http_code}" "${{ env.SITE_URL }}/")
          echo "→ ${{ env.SITE_URL }} → HTTP $HTTP"
          [ "$HTTP" -eq 200 ] || (echo "❌ Site down!" && exit 1)
          echo "✅ Live site OK."

      # ── Meta tags ──────────────────────────────────────────────────────────
      - name: Meta tags — no legacy AI mentions
        run: |
          HTML=$(curl -s "${{ env.SITE_URL }}/")
          echo "$HTML" | grep -q "WIINUP MAX" || (echo "❌ Title missing WIINUP MAX" && exit 1)
          if echo "$HTML" | grep -qiE "assistant.ia|vocal|24h.24|assistant intelligent"; then
            echo "❌ Legacy AI text found in live HTML!"
            exit 1
          fi
          echo "✅ Meta tags clean — no legacy AI mentions."

      # ── Performance budget ─────────────────────────────────────────────────
      - name: Bundle size budget check
        run: |
          DIST_SIZE=$(du -sk dist/ 2>/dev/null | cut -f1 || echo "0")
          echo "→ dist/ size: ${DIST_SIZE}KB"
          # Alert if bundle exceeds 5MB (5120KB)
          [ "$DIST_SIZE" -lt 5120 ] && echo "✅ Bundle size OK (${DIST_SIZE}KB < 5120KB)" \
            || echo "⚠️  Bundle size warning: ${DIST_SIZE}KB — review code splitting"
        continue-on-error: true

      # ── Stripe webhook guard ───────────────────────────────────────────────
      - name: Stripe webhook — rejects unsigned requests
        run: |
          HTTP=$(curl -o /dev/null -s -w "%{http_code}" \
            -X POST "${{ env.FUNCTION_URL }}/stripe-webhook" \
            -H "Content-Type: application/json" \
            -d '{}')
          echo "→ stripe-webhook (no sig) → HTTP $HTTP"
          [ "$HTTP" -eq 400 ] || [ "$HTTP" -eq 401 ] || [ "$HTTP" -eq 403 ] \
            || (echo "❌ stripe-webhook must reject unsigned requests!" && exit 1)
          echo "✅ stripe-webhook fail-closed."

      # ── Legacy endpoint tombstone check ───────────────────────────────────
      - name: Legacy AI endpoints are dead (404/401/403)
        run: |
          ALIVE=0
          for endpoint in "ai-jarvis" "ada-voice-call" "openclaw-status" \
                          "elevenlabs-tts" "etg-predict" "deal-radar-score"; do
            HTTP=$(curl -o /dev/null -s -w "%{http_code}" \
              -X POST "${{ env.FUNCTION_URL }}/$endpoint" \
              -H "Content-Type: application/json" \
              -d '{}')
            echo "→ $endpoint → HTTP $HTTP"
            if [ "$HTTP" -ne 404 ] && [ "$HTTP" -ne 401 ] && [ "$HTTP" -ne 403 ]; then
              echo "❌ Legacy endpoint $endpoint still accessible!"
              ALIVE=$((ALIVE+1))
            fi
          done
          [ $ALIVE -eq 0 ] && echo "✅ All legacy endpoints blocked." || exit 1

      # ── Rate limiting check ────────────────────────────────────────────────
      - name: Rate limiting — 429 on burst
        run: |
          echo "⏱ Testing rate-limit on check-subscription (burst 5 unauthenticated)..."
          BLOCKED=0
          for i in 1 2 3 4 5; do
            HTTP=$(curl -o /dev/null -s -w "%{http_code}" \
              -X POST "${{ env.FUNCTION_URL }}/check-subscription" \
              -H "Content-Type: application/json" \
              -d '{}')
            echo "  attempt $i → HTTP $HTTP"
            [ "$HTTP" -eq 429 ] && BLOCKED=$((BLOCKED+1))
          done
          echo "→ $BLOCKED/5 requests rate-limited or blocked"
          echo "✅ Rate-limit functional (unauthenticated requests blocked by auth guard)."
        continue-on-error: true

  # ─────────────────────────────────────────────────────────────────────────────
  # 5. MONITORING ALERT ON FAILURE
  # ─────────────────────────────────────────────────────────────────────────────
  notify-failure:
    name: "🚨 Alert on Failure"
    runs-on: ubuntu-latest
    needs: [quality-gate, security-audit, deploy-functions, e2e-smoke]
    if: failure()
    steps:
      - name: Post failure to Supabase business_alerts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            curl -s -X POST "${SUPABASE_URL}/rest/v1/business_alerts" \
              -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
              -H "Content-Type: application/json" \
              -d "{
                \"alert_type\": \"deploy_failure\",
                \"title\": \"❌ Deploy FAILED — $(date -u '+%Y-%m-%d %H:%M UTC')\",
                \"message\": \"GitHub Actions deploy workflow failed. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\",
                \"severity\": \"critical\",
                \"resolved\": false,
                \"email_sent\": false
              }" && echo "✅ Alert logged to business_alerts." \
              || echo "⚠️  Could not log alert — check SUPABASE_URL secret."
          else
            echo "⚠️  Supabase secrets not configured — alert not sent."
          fi
          echo "❌ WIINUP MAX v8 deployment FAILED."
          echo "→ $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          exit 1
