name: CI — WiinupMax

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  security-check:
    name: Security gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check .env not tracked
        run: |
          if git ls-files | grep -E "^\.env$|^\.env\."; then
            echo "::warning title=Security::⚠️ .env file is tracked by git — run: git rm --cached .env"
          else
            echo "✓ No .env files tracked"
          fi

      - name: Check .gitignore contains .env
        run: |
          if ! grep -q "\.env" .gitignore 2>/dev/null; then
            echo "::warning title=Security::⚠️ .gitignore does not block .env — the security-guard workflow will auto-patch on next push"
          else
            echo "✓ .gitignore blocks .env"
          fi

      - name: Scan for hardcoded secrets
        run: |
          if grep -rn "service_role\|STRIPE_SECRET\|webhook.*secret" src/ --include="*.ts" --include="*.tsx" 2>/dev/null; then
            echo "::error title=Security::❌ Potential secret found in src/ — review immediately"
            exit 1
          else
            echo "✓ No hardcoded secrets found in src/"
          fi

  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    needs: security-check
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npx vitest run --reporter=verbose
        env:
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: placeholder_anon_key

      - name: Build verification
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: placeholder_anon_key

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - name: Check for HIGH/CRITICAL vulnerabilities
        run: npm audit --audit-level=high || true
