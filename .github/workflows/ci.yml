name: CI — WiinupMax

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  security-check:
    name: Security gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check .env not tracked
        run: |
          if git ls-files | grep -E "^\.env$|^\.env\."; then
            echo "FATAL: .env file is tracked by git. Remove it immediately."
            exit 1
          fi
          echo "✓ No .env files tracked"

      - name: Check .gitignore contains .env
        run: |
          if ! grep -q "\.env" .gitignore; then
            echo "FATAL: .gitignore does not block .env files."
            exit 1
          fi
          echo "✓ .gitignore blocks .env"

  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    needs: security-check
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npx vitest run --reporter=verbose
        env:
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: placeholder_anon_key

      - name: Build verification
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: placeholder_anon_key

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - name: Check for HIGH/CRITICAL vulnerabilities
        run: npm audit --audit-level=high || true
