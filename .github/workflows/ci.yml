name: CI — WIINUP MAX v7

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: ESLint
        run: npm run lint

      - name: Unit tests (Vitest)
        run: npm run test

      - name: Production build
        run: npm run build

      - name: No legacy AI in frontend source
        run: |
          LEGACY=0
          for pattern in "ai-jarvis" "ai-lead-scoring" "ai-matching" "ai-prospection" \
                         "ada-voice-call" "ada-orchestrator" "openclaw" "elevenlabs" \
                         "etg-aggregate" "etg-ingest" "etg-predict" "deal-radar-score"; do
            if grep -rn --include="*.ts" --include="*.tsx" \
              --exclude-dir=node_modules "$pattern" src/ 2>/dev/null; then
              echo "❌ Legacy ref '$pattern' found in frontend!"
              LEGACY=$((LEGACY+1))
            fi
          done
          [ $LEGACY -eq 0 ] && echo "✅ No legacy AI refs in frontend." || exit 1

  # ── Security Audit ──────────────────────────────────────────────────────────
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci

      - name: npm audit (high + critical only)
        run: npm audit --audit-level=high

      - name: No hardcoded secrets
        run: |
          echo "🔍 Scanning for hardcoded secrets..."
          if grep -rn \
            --include="*.ts" --include="*.tsx" --include="*.js" \
            --exclude-dir=node_modules --exclude-dir=.git \
            -E "(sk_live_|sk_test_|whsec_|service_role.*eyJ|SUPABASE_SERVICE_ROLE)" \
            src/ supabase/functions/ 2>/dev/null | \
            grep -v "Deno.env.get\|process.env\|import.meta.env\|// " ; then
            echo "❌ Potential hardcoded secret found!"
            exit 1
          fi
          echo "✅ No hardcoded secrets."

      - name: RLS / Auth guard coverage
        run: |
          echo "🔒 Verifying auth guards in Edge Functions..."
          UNGUARDED=0
          for f in supabase/functions/*/index.ts; do
            name=$(basename $(dirname "$f"))
            case "$name" in stripe-webhook|auth-email-hook|track-click) continue ;; esac
            if ! grep -qE "(requireAuth|supabase\.auth\.getUser|SERVICE_KEY|SUPABASE_SERVICE_ROLE_KEY|Authorization)" "$f" 2>/dev/null; then
              echo "⚠️  $f — no auth guard"
              UNGUARDED=$((UNGUARDED+1))
            fi
          done
          [ $UNGUARDED -eq 0 ] && echo "✅ All Edge Functions guarded." \
            || (echo "❌ $UNGUARDED unguarded function(s)!" && exit 1)

      - name: No wildcard CORS
        run: |
          if grep -rn --include="*.ts" --exclude-dir=node_modules \
            'Allow-Origin.*\*' supabase/functions/_shared/cors.ts 2>/dev/null | \
            grep -v "wiinupmax.com\|lovable.app\|localhost"; then
            echo "❌ Wildcard CORS detected!"
            exit 1
          fi
          echo "✅ CORS hardened."

# ── MANUAL GATES (run before go-live) ────────────────────────────────────────
#
#   1. Stripe E2E:
#        stripe listen --forward-to <function-url>
#        stripe trigger checkout.session.completed
#        Verify: subscription row + founder_pass status
#
#   2. Seed first 5 clients:
#        Run scripts/seed-first-clients.sql in Lovable Cloud > SQL Editor
#
#   3. Full smoke test:
#        ./deploy.sh
#
# Documented in docs/compliance.md and ROADMAP.md §Phase1.
