name: CI — WIINUP MAX v9

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # 1. QUALITY GATE
  # ─────────────────────────────────────────────────────────────────────────────
  quality-gate:
    name: "🏗️ Quality Gate"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: ESLint
        run: npm run lint

      - name: Unit tests (Vitest)
        run: npm run test

      - name: Production build
        run: npm run build

      - name: No legacy AI in frontend source
        run: |
          LEGACY=0
          for pattern in "ai-jarvis" "ai-lead-scoring" "ai-matching" "ai-prospection" \
                         "ada-voice-call" "ada-orchestrator" "openclaw" "elevenlabs" \
                         "etg-aggregate" "etg-ingest" "etg-predict" "deal-radar-score"; do
            if grep -rn --include="*.ts" --include="*.tsx" \
              --exclude-dir=node_modules "$pattern" src/ 2>/dev/null; then
              echo "❌ Legacy ref '$pattern' found!"
              LEGACY=$((LEGACY+1))
            fi
          done
          [ $LEGACY -eq 0 ] && echo "✅ No legacy AI refs." || exit 1

      - name: Bundle size budget (< 2MB JS)
        run: |
          JS_SIZE=$(find dist/assets -name "*.js" -exec wc -c {} + 2>/dev/null | tail -1 | awk '{print $1}' || echo "0")
          JS_KB=$((JS_SIZE / 1024))
          echo "→ JS bundle: ${JS_KB}KB"
          [ "$JS_KB" -lt 2048 ] \
            && echo "✅ Bundle OK" \
            || echo "⚠️  Bundle > 2MB — consider splitting lucide-react & framer-motion"
        continue-on-error: true

  # ─────────────────────────────────────────────────────────────────────────────
  # 2. SECURITY AUDIT
  # ─────────────────────────────────────────────────────────────────────────────
  security-audit:
    name: "🔒 Security Audit"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci

      - name: npm audit (high + critical only)
        run: npm audit --audit-level=high

      - name: No hardcoded secrets
        run: |
          echo "🔍 Scanning for hardcoded secrets..."
          if grep -rn \
            --include="*.ts" --include="*.tsx" --include="*.js" \
            --exclude-dir=node_modules --exclude-dir=.git \
            -E "(sk_live_|sk_test_|whsec_|service_role.*eyJ|SUPABASE_SERVICE_ROLE)" \
            src/ supabase/functions/ 2>/dev/null | \
            grep -v "Deno.env.get\|process.env\|import.meta.env\|// "; then
            echo "❌ Potential hardcoded secret found!"
            exit 1
          fi
          echo "✅ No hardcoded secrets."

      - name: RLS / Auth guard coverage
        run: |
          echo "🔒 Verifying auth guards in Edge Functions..."
          UNGUARDED=0
          for f in supabase/functions/*/index.ts; do
            name=$(basename $(dirname "$f"))
            case "$name" in stripe-webhook|auth-email-hook|track-click) continue ;; esac
            if ! grep -qE "(requireAuth|supabase\.auth\.getUser|SERVICE_KEY|SUPABASE_SERVICE_ROLE_KEY|Authorization)" "$f" 2>/dev/null; then
              echo "⚠️  $f — no auth guard"
              UNGUARDED=$((UNGUARDED+1))
            fi
          done
          [ $UNGUARDED -eq 0 ] && echo "✅ All Edge Functions guarded." \
            || (echo "❌ $UNGUARDED unguarded function(s)!" && exit 1)

      - name: Rate-limit coverage audit
        run: |
          echo "⏱ Rate-limit audit on public-facing functions..."
          for f in supabase/functions/*/index.ts; do
            name=$(basename $(dirname "$f"))
            case "$name" in
              stripe-webhook|auth-email-hook|track-click|\
              send-welcome-email|send-reactivation-email|\
              notify-gain-paye|notify-intro-validated|\
              notify-royalty-split|process-email-queue|\
              process-pending-payouts|bank-webhook) continue ;;
            esac
            grep -qE "(checkRateLimit|rateLimit|rate_limit)" "$f" 2>/dev/null \
              && echo "  ✅ $name — rate-limit OK" \
              || echo "  ℹ️  $name — no rate-limit (review if public)"
          done

      - name: No wildcard CORS
        run: |
          if grep -rn --include="*.ts" --exclude-dir=node_modules \
            'Allow-Origin.*\*' supabase/functions/_shared/cors.ts 2>/dev/null | \
            grep -v "wiinupmax.com\|lovable.app\|localhost"; then
            echo "❌ Wildcard CORS!"; exit 1
          fi
          echo "✅ CORS hardened."

