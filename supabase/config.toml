# ── JWT VERIFICATION STRATEGY ─────────────────────────────────────────────────
# Lovable Cloud uses ES256 JWT signing. The Supabase gateway's built-in
# verify_jwt uses HS256 and rejects ES256 tokens with "Invalid JWT".
# ALL functions use verify_jwt = false and validate JWTs in-code via
# supabase.auth.getUser(token) — this is the correct security pattern.
# ─────────────────────────────────────────────────────────────────────────────

# ── PUBLIC ENDPOINTS (no user JWT at all) ────────────────────────────────────
# stripe-webhook : Stripe sends events using HMAC signature, not user JWTs
[functions.stripe-webhook]
verify_jwt = false

# track-click : public share links, anonymous access required
[functions.track-click]
verify_jwt = false

# ── AUTHENTICATED ENDPOINTS — JWT validated in-code via getUser(token) ────────

[functions.create-checkout]
verify_jwt = false

[functions.check-subscription]
verify_jwt = false

