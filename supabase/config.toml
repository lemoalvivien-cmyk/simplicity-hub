# SECURITY: verify_jwt = false is MANDATORY for all functions in Lovable Cloud.
# The gateway uses ES256 signing keys that are incompatible with the built-in JWT
# verification. Authentication is enforced IN-CODE via getClaims()/getUser().
# Do NOT set verify_jwt = true — it will reject all legitimate requests.

[functions]
  # ── Public webhooks (server-to-server — no user JWT) ───────────────────────
  [functions.stripe-webhook]
    verify_jwt = false  # SECURITY: validated via Stripe HMAC signature

  [functions.auth-email-hook]
    verify_jwt = false  # SECURITY: called by Supabase auth system

  [functions.track-click]
    verify_jwt = false  # SECURITY: public pixel endpoint

  [functions.bank-webhook]
    verify_jwt = false  # SECURITY: validated via x-bank-signature + fail-closed

  # ── Internal notify / email (DB triggers via pg_net) ───────────────────────
  # SECURITY: validated in-code via x-internal-secret header
  [functions.notify-gain-paye]
    verify_jwt = false

  [functions.notify-intro-validated]
    verify_jwt = false

  [functions.notify-royalty-split]
    verify_jwt = false

  [functions.send-welcome-email]
    verify_jwt = false

  [functions.send-reactivation-email]
    verify_jwt = false  # SECURITY: additionally validated via admin JWT

  [functions.business-alert-dispatcher]
    verify_jwt = false  # SECURITY: validated via admin JWT or x-cron-secret

  # ── Billing ─────────────────────────────────────────────────────────────────
  [functions.check-subscription]
    verify_jwt = false

  [functions.create-checkout]
    verify_jwt = false

  [functions.customer-portal]
    verify_jwt = false

  # ── Payout & Promo ──────────────────────────────────────────────────────────
  [functions.process-email-queue]
    verify_jwt = false

  [functions.process-pending-payouts]
    verify_jwt = false  # SECURITY: validated via admin JWT or x-cron-secret

  [functions.redeem-promo]
    verify_jwt = false

  # ── Transactional business flows ────────────────────────────────────────────
  # SECURITY: auth validated in-code via requireAuth()
  [functions.submit-introduction]
    verify_jwt = false

  [functions.validate-introduction]
    verify_jwt = false

  # ── Cron jobs ────────────────────────────────────────────────────────────────
  # SECURITY: validated via x-cron-secret header
  [functions.cron-reactivation]
    verify_jwt = false

  # ── User self-service ────────────────────────────────────────────────────────
  # SECURITY: auth validated in-code via requireAuth()
  [functions.request-refund]
    verify_jwt = false
