# ── PUBLIC ENDPOINTS — verify_jwt = false (legitimate reasons) ───────────────
# stripe-webhook : Stripe sends events without a user JWT (HMAC signature used instead)
[functions.stripe-webhook]
verify_jwt = false

# track-click : public share links, no auth required
[functions.track-click]
verify_jwt = false

# ── ALL OTHER ENDPOINTS — verify_jwt = true ──────────────────────────────────
