project_id = "usnriklfiagazpffsqew"

# ── PUBLIC ENDPOINTS — verify_jwt = false (legitimate reasons) ───────────────
# stripe-webhook : Stripe sends events without a user JWT (HMAC signature used instead)
[functions.stripe-webhook]
verify_jwt = false

# track-click : public share links, no auth required
[functions.track-click]
verify_jwt = false

# ── AUTHENTICATED ENDPOINTS — verify_jwt = true ──────────────────────────────
# All other functions require a valid JWT (user or service-role) at the proxy level.

[functions.create-checkout]
verify_jwt = true

[functions.check-subscription]
verify_jwt = true

[functions.customer-portal]
verify_jwt = true

[functions.redeem-promo]
verify_jwt = true

[functions.openclaw-healthcheck]
verify_jwt = true

[functions.openclaw-gateway]
verify_jwt = true

[functions.openclaw-dossier-sync]
verify_jwt = true

[functions.openclaw-kill-switch]
verify_jwt = true

[functions.openclaw-validate]
verify_jwt = true

[functions.openclaw-generate]
verify_jwt = true

[functions.openclaw-status]
verify_jwt = true

[functions.elevenlabs-voice-token]
verify_jwt = true

[functions.deal-radar-score]
verify_jwt = true

[functions.openclaw-generate-packs]
verify_jwt = true

[functions.openclaw-channel-probe]
verify_jwt = true

# openclaw-job-executor: called by scheduler (service-role Bearer) or user JWT.
# verify_jwt = true — Supabase proxy accepts both user JWTs and the service-role key.
[functions.openclaw-job-executor]
verify_jwt = true

# openclaw-scheduler: invoked by pg_cron (service-role Bearer) or manual user trigger.
# verify_jwt = true — Supabase proxy accepts both user JWTs and the service-role key.
[functions.openclaw-scheduler]
verify_jwt = true

[functions.openclaw-event-bus]
verify_jwt = true

[functions.openclaw-smoke-test]
verify_jwt = true

[functions.openclaw-channel-dispatch]
verify_jwt = true

[functions.openclaw-graph-engine]
verify_jwt = true

# send-reactivation-email: called by admin only (admin JWT + role check in function)
[functions.send-reactivation-email]
verify_jwt = true
