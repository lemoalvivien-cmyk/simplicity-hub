# ── PUBLIC ENDPOINTS — verify_jwt = false (legitimate reasons) ───────────────
# stripe-webhook : Stripe sends events without a user JWT (HMAC signature used instead)
[functions.stripe-webhook]
verify_jwt = false

# track-click : public share links, no auth required
[functions.track-click]
verify_jwt = false

# ── AUTHENTICATED ENDPOINTS — verify_jwt = true ──────────────────────────────
# All other functions require a valid JWT (user or service-role) at the proxy level.

# ── Lovable Cloud uses ES256 JWT signing — verify_jwt must be false for all
# ── authenticated functions; JWT is validated in-code via getUser(token). ──────

