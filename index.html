          <h1 style="font-size: 28px; font-weight: 700; margin: 0 0 12px;">WIINUP MAX — Trouvez vos prochains clients B2B via votre réseau de facilitateurs</h1>
          <p style="font-size: 16px; line-height: 1.7; margin: 0 0 20px;"><strong>Vos contacts envoient des introductions qualifiées. Vous ne payez que si ça marche.</strong> Marketplace B2B d'apport d'affaires structurée, traçable et automatisée. Founder Pass à 99 €/an.</p>
          <h2 style="font-size: 20px; font-weight: 600; margin: 0 0 12px;">Comment ça marche</h2>
          <ol style="line-height: 2; padding-left: 20px; margin: 0 0 20px;">
            <li>L'entreprise crée une mission (profil client idéal recherché)</li>
            <li>Le réseau de facilitateurs envoie des introductions ciblées et qualifiées</li>
            <li>L'entreprise valide les contacts pertinents et verse une commission uniquement sur les deals conclus</li>
          </ol>
          <h2 style="font-size: 20px; font-weight: 600; margin: 0 0 12px;">Fonctionnalités principales</h2>
          <ul style="line-height: 2; padding-left: 20px; margin: 0 0 20px;">
            <li><strong>Tableau de bord entreprise</strong> — gestion des missions, introductions et facilitateurs</li>
            <li><strong>Assistant IA KITT</strong> — scoring automatique des contacts, priorisation par pertinence</li>
            <li><strong>Traçabilité totale</strong> — chaque introduction est datée, sourcée et mesurable</li>
            <li><strong>Commissions automatiques</strong> — paiements sécurisés via Stripe, split en temps réel</li>
            <li><strong>Créer son Emploi</strong> — devenez facilitateur et monétisez votre réseau professionnel</li>
          </ul>
          <h2 style="font-size: 20px; font-weight: 600; margin: 0 0 12px;">Tarification</h2>
          <p style="margin: 0 0 8px;"><strong>Founder Pass : 99 €/an</strong> — accès illimité, facilitateurs gratuits.</p>
          <p style="margin: 0 0 20px;">Prix garanti à vie. Résiliation libre. Aucun engagement.</p>
          <h2 style="font-size: 20px; font-weight: 600; margin: 0 0 12px;">À propos</h2>
